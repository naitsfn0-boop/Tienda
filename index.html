<style>

  --display:"Outfit","Trebuchet MS",sans-serif; --body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fff;color:var(--tinta);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--verde-cl);outline-offset:2px}

header.top{position:sticky;top:0;z-index:40;background:var(--verde-osc);color:#fff}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0}
.logo{font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.top-link{font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:7px 15px;color:#fff;background:none}

.hero{background:linear-gradient(150deg,var(--verde-osc),var(--verde) 62%,var(--verde-cl));color:#fff;padding:52px 0 88px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:-6%;right:-6%;bottom:-46px;height:92px;background:#fff;border-radius:50% 50% 0 0}
.hero-in{position:relative;z-index:2;max-width:640px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7.6vw,54px);line-height:1.04;letter-spacing:-.03em;margin:0 0 14px}
.hero p{font-size:17px;opacity:.9;margin:0 0 26px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}

.btn{border:0;border-radius:99px;padding:13px 24px;font-weight:600;font-size:15px;background:var(--ambar);color:#3A2400}
.btn.line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.btn.verde{background:var(--verde);color:#fff}
.btn.sm{padding:9px 16px;font-size:14px}
.btn.gris{background:var(--papel);color:var(--tinta);border:1px solid var(--linea)}
.btn.ok{background:var(--ok);color:#fff}
.btn.rojo{background:transparent;color:var(--rojo);border:1px solid #FBC9C3}
.btn:disabled{opacity:.45;cursor:not-allowed}

section{padding:46px 0}
.alt{background:var(--papel)}
.sec-h{margin:0 0 6px;font-family:var(--display);font-weight:800;font-size:clamp(24px,4.6vw,32px)}
.sec-p{color:var(--gris);margin:0 0 26px;font-size:15.5px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:14px}
.tile{border:0;padding:0;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:1/1;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end}
.tile[aria-pressed="true"]{outline:3px solid var(--tinta);outline-offset:3px}
.tile .glare{position:absolute;inset:0;background:linear-gradient(200deg,rgba(255,255,255,.28),rgba(0,0,0,.22))}
.tile.foto .glare{background:linear-gradient(180deg,rgba(0,0,0,.05) 35%,rgba(0,0,0,.72))}
.tile .mono{position:absolute;right:6px;bottom:-14px;font-family:var(--display);font-weight:800;font-size:88px;line-height:1;opacity:.22}

.tile .tn{font-family:var(--display);font-weight:800;font-size:19px;display:block;line-height:1.05}
.tile .tc{font-size:12.5px;opacity:.92}
.tile.all{background:var(--tinta)}

.planes{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.plan{background:#fff;border:1px solid var(--linea);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:9px}

.plan .desc{color:var(--gris);font-size:13.8px;margin:0;flex:1}
.precio{font-family:var(--display);font-weight:800;font-size:28px}
.precio small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--gris);margin-left:6px}
.plan-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--linea);padding-top:12px}
.disp{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.disp i{width:7px;height:7px;border-radius:50%}

.pasos{counter-reset:p;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.paso{counter-increment:p;position:relative;padding-top:44px}
.paso::before{content:counter(p);position:absolute;top:0;left:0;width:34px;height:34px;border-radius:50%;background:var(--verde);color:#fff;font-family:var(--display);font-weight:700;display:flex;align-items:center;justify-content:center}
.paso b{font-family:var(--display);font-size:16.5px;display:block;margin-bottom:4px}
.paso span{color:var(--gris);font-size:14px}

details{border-bottom:1px solid var(--linea);padding:16px 0}
details summary{cursor:pointer;font-weight:600;font-size:15.5px;list-style:none;display:flex;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--verde);font-size:20px}
details[open] summary::after{content:"–"}
details p{color:var(--gris);margin:10px 0 0;font-size:14.5px}

footer{background:var(--verde-osc);color:#fff;padding:34px 0 84px}
.foot-in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px;opacity:.88}
.link-min{background:none;border:1px solid rgba(255,255,255,.28);border-radius:8px;color:#fff;font-size:13px;padding:9px 16px;opacity:.7}

.wa-float{position:fixed;right:16px;bottom:16px;z-index:50;background:#25D366;color:#fff;border-radius:99px;padding:13px 20px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px}
.wa-float svg{width:20px;height:20px}

.overlay{position:fixed;inset:0;background:rgba(17,36,29,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:470px;border-radius:22px 22px 0 0;padding:22px;max-height:92vh;overflow:auto}
@media(min-width:640px){.modal{border-radius:22px}}
.modal h3{font-family:var(--display);font-weight:800;font-size:21px;margin:0 0 4px}
.modal .sub{color:var(--gris);font-size:14px;margin:0 0 16px}
label{display:block;font-size:13px;font-weight:600;color:var(--gris);margin:14px 0 6px}
input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--linea);color:var(--tinta);border-radius:11px;padding:12px;font-family:inherit;font-size:15px}
textarea{min-height:100px;resize:vertical;font-size:14px}
.fila{display:flex;gap:10px}.fila>*{flex:1}
.acc{display:flex;gap:10px;margin-top:20px}.acc>*{flex:1;text-align:center}
.aviso{background:var(--papel);border-radius:12px;padding:14px;font-size:13.5px;color:var(--gris);margin-top:14px}
.err{color:var(--rojo);font-size:13.5px;margin:10px 0 0}

.metodos{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.met{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--linea);border-radius:12px;padding:13px;background:#fff;text-align:left;width:100%}
.met[aria-pressed="true"]{border-color:var(--verde);background:#F1F7F4}
.met .r{width:17px;height:17px;border-radius:50%;border:2px solid var(--linea);flex:none;margin-top:2px}
.met[aria-pressed="true"] .r{border-color:var(--verde);border-width:5px}
.met b{display:block;font-size:14.5px;font-family:var(--display);font-weight:700}
.met span{font-size:13px;color:var(--gris)}

.codigo{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:17px;letter-spacing:.12em;background:var(--verde);color:#fff;border-radius:9px;padding:8px 12px;display:inline-block}
.ref-xl{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:34px;letter-spacing:.2em;
  text-align:center;background:var(--verde);color:#fff;border-radius:14px;padding:22px 10px;margin:14px 0 4px}
.ref-nota{text-align:center;font-size:13px;color:var(--gris);margin:0 0 4px}
.codigo-xl{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:26px;letter-spacing:.18em;text-align:center;background:var(--papel);border:1.5px dashed var(--linea);border-radius:12px;padding:16px;margin-top:12px}
#canje-in{text-transform:uppercase;letter-spacing:.14em;font-family:ui-monospace,Menlo,monospace;font-size:19px;text-align:center}
.cred{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--papel);border-radius:10px;padding:10px;margin-top:10px;word-break:break-all;white-space:pre-wrap}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--linea);margin:20px 0 22px;overflow-x:auto}
.tab{background:none;border:0;color:var(--gris);padding:12px 14px;font-size:14.5px;font-weight:600;white-space:nowrap;border-bottom:2.5px solid transparent}

.stat b{font-family:var(--display);font-weight:800;font-size:24px;display:block}

.item{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:16px;margin-bottom:12px}
.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

.item-meta{color:var(--gris);font-size:13.5px;margin-top:3px}
.item-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.t-ok{background:#E7F8F0;color:#04724D}
.t-esp{background:#FEF3E2;color:#B54708}
.t-off{background:var(--papel);color:var(--gris)}
.t-ven{background:#E7F1EB;color:var(--verde)}
.vacio{border:1.5px dashed var(--linea);border-radius:16px;padding:30px 20px;text-align:center;color:var(--gris);font-size:14.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;z-index:90;background:var(--tinta);color:#fff;padding:12px 20px;border-radius:99px;font-size:14.5px;font-weight:600}
.cargando{padding:70px 0;text-align:center;color:var(--gris)}

<script>
/* ====== CONEXION (sin librerias externas) ====== */
const SB_URL = 'https://mebraaifynazesipbuwy.supabase.co';
const SB_KEY = 'sb_publishable_i4KMm4uG2WFrYXVyMVb_Zg_aWtA6F18';
let TOKEN = null;

function heads(extra){
  return Object.assign({
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + (TOKEN || SB_KEY),
    'Content-Type': 'application/json'
  }, extra||{});
}

class Q{
  constructor(t){ this.t=t; this.f=[]; this.m='GET'; this.body=null; this.sel='*'; this.one=false; }
  select(s){ if(s) this.sel=s; return this; }
  insert(b){ this.m='POST'; this.body=b; return this; }
  update(b){ this.m='PATCH'; this.body=b; return this; }
  delete(){ this.m='DELETE'; return this; }
  eq(c,v){ this.f.push(c+'=eq.'+encodeURIComponent(v)); return this; }
  order(c,o){ this.f.push('order='+c+'.'+(o&&o.ascending===false?'desc':'asc')); return this; }
  single(){ this.one=true; return this; }
  async run(){
    let url = SB_URL + '/rest/v1/' + this.t;
    const p = this.f.slice();
    if(this.m==='GET') p.unshift('select=' + encodeURIComponent(this.sel));
    if(p.length) url += '?' + p.join('&');
    try{
      const r = await fetch(url, {
        method: this.m,
        headers: heads(this.m==='GET'?{}:{'Prefer':'return=minimal'}),
        body: this.body? JSON.stringify(this.body) : undefined
      });
      if(!r.ok){
        let msg = await r.text();
        return { data:null, error:{ message: msg || ('HTTP '+r.status) } };
      }
      if(this.m!=='GET') return { data:null, error:null };
      const j = await r.json();
      return { data: this.one? (j[0]||null) : j, error:null };
    }catch(e){
      return { data:null, error:{ message:'Sin conexion con la base' } };
    }
  }
  then(ok,no){ return this.run().then(ok,no); }
}

const sb = {
  from(t){ return new Q(t); },
  async rpc(fn, body){
    try{
      const r = await fetch(SB_URL+'/rest/v1/rpc/'+fn, {
        method:'POST', headers: heads(), body: JSON.stringify(body||{})
      });
      const txt = await r.text();
      if(!r.ok) return { data:null, error:{ message: txt } };
      return { data: txt? JSON.parse(txt) : null, error:null };
    }catch(e){ return { data:null, error:{ message:'Sin conexion' } }; }
  },
  auth:{
    async signInWithPassword({email,password}){
      try{
        const r = await fetch(SB_URL+'/auth/v1/token?grant_type=password', {
          method:'POST',
          headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
          body: JSON.stringify({email,password})
        });
        const j = await r.json();
        if(!r.ok || !j.access_token) return { error:{ message: j.error_description || 'Credenciales invalidas' } };
        TOKEN = j.access_token;
        return { error:null };
      }catch(e){ return { error:{ message:'Sin conexion' } }; }
    },
    async signOut(){ TOKEN=null; return {}; },
    async getSession(){ return { data:{ session: null } }; }
  }
};

/* ====== ESTADO ====== */
let cfg={}, planes=[], vista='tienda', tab='pedidos', filtro='Todos', sesion=null;
let productos=[], cuentas=[], pedidos=[];

const CLP=n=>'$'+Number(n||0).toLocaleString('es-CL');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const ICON_WA='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.02c-.24.68-1.2 1.26-1.96 1.42-.52.11-1.2.2-3.5-.75-2.94-1.22-4.83-4.2-4.98-4.4-.14-.2-1.19-1.58-1.19-3.02s.76-2.14 1.03-2.44c.27-.3.58-.37.78-.37h.56c.18 0 .42-.07.66.5.24.58.82 2 .89 2.15.07.15.12.32.02.51-.1.2-.15.32-.3.49-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.3.76 1.25 1.63 2.03 1.12 1 2.06 1.31 2.36 1.46.3.15.47.13.64-.08.17-.2.73-.86.93-1.15.2-.3.39-.25.66-.15.27.1 1.71.81 2 .96.3.15.49.22.56.34.07.13.07.73-.17 1.41z"/></svg>';

function toast(m){$('toast-root').innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>$('toast-root').innerHTML='',2400);}
function copiar(t){navigator.clipboard?.writeText(t).then(()=>toast('Copiado'));}
function waURL(msg){
  const v=(cfg.whatsapp||'').trim(); if(!v) return '#';
  const base=/^https?:\/\//i.test(v)?v:'https://wa.me/'+v.replace(/\D/g,'');
  return msg? base+(base.includes('?')?'&':'?')+'text='+msg : base;
}
function ref(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:6},()=>A[Math.floor(Math.random()*A.length)]).join('');
}

/* ====== CARGA PUBLICA ====== */
async function cargarPublico(){
  const [c,p]=await Promise.all([
    sb.from('config').select('*').eq('id',1).single(),
    sb.from('vw_planes').select('*').order('orden')
  ]);
  if(c.data) cfg=c.data;
  planes=p.data||[];
  if(!c.data && p.error){
    $('app').innerHTML='<div class="cargando">No se pudo conectar con la base.<br><br>'+esc(p.error.message)+'</div>';
    return false;
  }
  return true;
}

/* ====== CARGA ADMIN ====== */
async function cargarAdmin(){
  const [pr,cu,pe]=await Promise.all([
    sb.from('productos').select('*').order('orden'),
    sb.from('cuentas').select('*').order('creado'),
    sb.from('pedidos').select('*, pedido_items(*)').order('creado',{ascending:false})
  ]);
  productos=pr.data||[]; cuentas=cu.data||[]; pedidos=pe.data||[];
}

async function achicar(file, max){
  const img = await new Promise((ok,no)=>{
    const i=new Image(); const r=new FileReader();
    r.onload=()=>{ i.onload=()=>ok(i); i.onerror=no; i.src=r.result; };
    r.onerror=no; r.readAsDataURL(file);
  });
  let {width:w, height:h} = img;
  const esc2 = Math.min(1, max/Math.max(w,h));
  w=Math.round(w*esc2); h=Math.round(h*esc2);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.82));
}
async function subirImagen(file){
  const blob = await achicar(file, 700);
  const nombre = 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.jpg';
  const r = await fetch(SB_URL+'/storage/v1/object/imagenes/'+nombre, {
    method:'POST',
    headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+(TOKEN||SB_KEY), 'Content-Type':'image/jpeg' },
    body: blob
  });
  if(!r.ok) throw new Error(await r.text());
  return SB_URL+'/storage/v1/object/public/imagenes/'+nombre;
}

/* ====== TIENDA ====== */
function metodos(){
  const m=[];
  if(cfg.tarjeta_on&&cfg.link_pago) m.push({id:'tarjeta',n:'Tarjeta de crédito o débito',d:'Pagas en línea y te enviamos el código.'});
  if(cfg.transferencia_on) m.push({id:'transferencia',n:'Transferencia o depósito',d:'Mandas el comprobante por WhatsApp.'});
  if(cfg.caja_on) m.push({id:'caja',n:'Caja Vecina o efectivo',d:'Pagas en el local y mandas el voucher.'});
  return m;
}
function tiendaHTML(){
  const servicios=[...new Set(planes.map(p=>p.servicio))];
  const lista=filtro==='Todos'?planes:planes.filter(p=>p.servicio===filtro);

  const tiles=`<button class="tile all" data-filtro="Todos" aria-pressed="${filtro==='Todos'}">
    <span class="glare"></span><span class="tb"><span class="tn">Ver todo</span><span class="tc">${planes.length} planes</span></span></button>`+
    servicios.map(sv=>{
      const ps=planes.filter(p=>p.servicio===sv);
      const n=ps.reduce((a,p)=>a+p.disponibles,0);
      const col=ps[0].color, img=(ps.find(x=>x.imagen)||{}).imagen;
      const fondo=img?`background-image:url('${esc(img)}');background-size:cover;background-position:center;background-color:${esc(col)}`
                    :`background:linear-gradient(145deg,${esc(col)},${esc(col)}CC)`;
      return `<button class="tile${img?' foto':''}" data-filtro="${esc(sv)}" aria-pressed="${filtro===sv}" style="${fondo}">
        ${img?'':`<span class="mono">${esc(sv.trim()[0]||'')}</span>`}<span class="glare"></span>
        <span class="tb"><span class="tn">${esc(sv)}</span><span class="tc">${n>0?n+' disponibles':'sin stock'}</span></span></button>`;
    }).join('');

  const cards=lista.map(p=>{
    const n=p.disponibles;
    const col=n===0?'var(--gris)':n<=2?'var(--ambar)':'var(--ok)';
    const txt=n===0?'Sin stock':n<=2?'Quedan '+n:n+' disponibles';
    return `<article class="plan">
      <div class="fila-top"><span class="pill" style="background:${esc(p.color)}">${esc(p.servicio)}</span>
      <span class="disp"><i style="background:${col}"></i>${txt}</span></div>
      <h3>${esc(p.nombre)}</h3><p class="desc">${esc(p.descripcion)}</p>
      <div class="plan-foot"><span class="precio">${CLP(p.precio)}<small>mes</small></span>
      ${n>0?`<button class="btn sm verde" data-comprar="${p.id}">Comprar</button>`:`<button class="btn sm gris" disabled>Agotado</button>`}</div>
    </article>`;
  }).join('')||'<div class="vacio">No hay planes disponibles ahora mismo.</div>';

  return `
  <header class="top"><div class="wrap top-in">

function panelHTML(){

  const vend=cuentas.filter(c=>c.estado==='vendida').length;
  const ing=pedidos.filter(p=>p.estado==='entregado').reduce((a,b)=>a+b.total,0);
  const t=[['pedidos','Pedidos'],['productos','Planes'],['cuentas','Cuentas'],['ajustes','Ajustes']];
  return `<header class="top"><div class="wrap top-in">
    <span class="logo">Panel</span>
    <span style="display:flex;gap:8px"><button class="top-link" data-salir>Ver tienda</button>
    <button class="top-link" data-logout>Salir</button></span>
  </div></header>
  <div class="wrap" style="padding-top:24px;padding-bottom:70px">
    <div class="stats">
      <div class="stat"><b>${pend}</b><span>Por entregar</span></div>
      <div class="stat"><b>${disp}</b><span>Cuentas en stock</span></div>
      <div class="stat"><b>${vend}</b><span>Vendidas</span></div>
      <div class="stat"><b>${CLP(ing)}</b><span>Entregado</span></div>
    </div>
    <div class="tabs">${t.map(([k,l])=>`<button class="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join('')}</div>

}
function cuerpo(){
  if(tab==='pedidos')return tPedidos();
  if(tab==='productos')return tProductos();
  if(tab==='cuentas')return tCuentas();
  return tAjustes();
}
function tPedidos(){
  if(!pedidos.length)return '<div class="vacio">Sin pedidos todavía.</div>';
  return pedidos.map(p=>{
    const tag=p.estado==='pendiente'?'<span class="tag t-esp">Por entregar</span>'
      :p.estado==='entregado'?'<span class="tag t-ok">Entregado</span>':'<span class="tag t-off">Cancelado</span>';
    const det=(p.pedido_items||[]).map(it=>{
      const pr=productos.find(x=>x.id===it.producto_id);
      return `${esc(pr?pr.servicio+' · '+pr.nombre:'—')} ×${it.cantidad}`;
    }).join('<br>');
    const mias=cuentas.filter(c=>c.pedido_id===p.id);
    const cods=mias.map(c=>c.codigo).join(', ');
    const msg=encodeURIComponent(`Hola ${p.cliente}! Tu pedido está listo. Tu código es: ${cods}\n\nCánjealo en la web con el botón "Ya tengo mi código".`);
    const wa=p.contacto.replace(/\D/g,'');
    return `<div class="item">
      <div class="item-head"><div>
        <b>${esc(p.numero)}${p.pago_ref?' · '+esc(p.pago_ref):''}</b>
        <div class="item-meta">${esc(p.cliente)} · ${esc(p.contacto)}</div>
        <div class="item-meta">${det}</div>
        <div class="item-meta">${new Date(p.creado).toLocaleString('es-CL')} · ${CLP(p.total)} · ${esc(p.metodo)}</div>
      </div>${tag}</div>
      ${mias.map(c=>`<div style="margin-top:10px"><span class="codigo">${esc(c.codigo)}</span></div><div class="cred">${esc(c.credencial)}</div>`).join('')}
      <div class="item-acts">
        ${p.estado==='pendiente'?`<button class="btn sm ok" data-entregar="${p.id}">Pagado, entregar</button>
          <button class="btn sm rojo" data-cancelar="${p.id}">Cancelar</button>`:''}
        ${p.estado==='entregado'?`<a class="btn sm gris" href="https://wa.me/${wa}?text=${msg}" target="_blank" rel="noopener">Enviar código</a>
          <button class="btn sm gris" data-copiar="${cods}">Copiar código</button>

  }).join('');
}
function tProductos(){
  const filas=productos.map(p=>{

/* ====== RENDER ====== */
function render(){ $('app').innerHTML = vista==='panel'?panelHTML():tiendaHTML(); }

/* ====== EVENTOS ====== */
document.addEventListener('click', async e=>{
  const t=e.target.closest('[data-comprar],[data-filtro],[data-scroll],[data-canje],[data-ok-canje],[data-panel],[data-salir],[data-logout],[data-tab],[data-cerrar],[data-listo],[data-quitar-img],[data-ov],[data-ok-compra],[data-pm],[data-met],[data-ok-login],[data-entregar],[data-deshacer],[data-cancelar],[data-borrar-ped],[data-copiar],[data-new-prod],[data-edit-prod],[data-tog-prod],[data-del-prod],[data-save-prod],[data-new-cta],[data-save-cta],[data-del-cta],[data-save-cfg]');
  if(!t)return; const d=t.dataset;
  if(t.hasAttribute('data-ov')&&e.target===t){cerrar();return;}
  if('cerrar' in d){cerrar();return;}
  if('quitarImg' in d){
    $('p-img').value='';
    const pv=$('p-prev'); if(pv) pv.remove();
    toast('Imagen quitada. Aprieta Guardar para confirmar.'); return;
  }
  if('listo' in d){
    if(t.dataset.confirmado){ cerrar(); return; }
    t.dataset.confirmado='1';
    t.textContent='Toca otra vez para cerrar';
    t.classList.remove('gris'); t.classList.add('verde');
    return;
  }
  if('copiar' in d){copiar(d.copiar);return;}
  if('scroll' in d){$(d.scroll)?.scrollIntoView({behavior:'smooth'});return;}
  if('filtro' in d){filtro=d.filtro;render();document.querySelector('.alt')?.scrollIntoView({behavior:'smooth'});return;}

  /* --- compra --- */
  if('comprar' in d){mCompra(d.comprar);return;}
  if('pm' in d){$('q-met').value=d.pm;document.querySelectorAll('[data-pm]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pm===d.pm));return;}
  if('okCompra' in d){
    const nombre=$('q-nombre').value.trim(), contacto=$('q-contacto').value.trim();
    const cant=parseInt($('q-cant').value,10), metodo=$('q-met').value;
    if(!nombre||!contacto){$('q-err').innerHTML='<p class="err">Falta tu nombre y un contacto.</p>';return;}
    const plan=planes.find(x=>x.id===d.okCompra);
    const id=crypto.randomUUID(), r=ref();
    const {error}=await sb.from('pedidos').insert({id,cliente:nombre,contacto,metodo,total:plan.precio*cant,pago_ref:r});
    if(error){$('q-err').innerHTML='<p class="err">No se pudo crear el pedido. Intenta de nuevo.</p>';return;}
    await sb.from('pedido_items').insert({pedido_id:id,producto_id:plan.id,cantidad:cant});
    mPedido(r,plan.precio*cant,metodo); return;
  }

  /* --- canje --- */
  if('canje' in d){mCanje();return;}
  if('okCanje' in d){
    const v=$('canje-in').value.trim();
    if(!v){$('canje-err').innerHTML='<p class="err">Escribe tu código.</p>';return;}
    const {data,error}=await sb.rpc('canjear',{p_codigo:v});
    if(error||!data||!data.length){
      const m=(error?.message||'').includes('NO_PAGADO')
        ? 'Ese código todavía no está habilitado. Escríbenos si ya pagaste.'
        : 'Ese código no existe. Revísalo.';
      $('canje-err').innerHTML='<p class="err">'+m+'</p>';return;
    }
    mCuenta(data[0]); return;
  }

  /* --- sesion --- */
  if('panel' in d){mLogin();return;}
  if('okLogin' in d){
    const {error}=await sb.auth.signInWithPassword({email:$('l-mail').value.trim(),password:$('l-pass').value});
    if(error){$('l-err').innerHTML='<p class="err">Correo o contraseña incorrectos.</p>';return;}
    cerrar(); sesion=true; vista='panel'; tab='pedidos';
    await cargarAdmin(); render(); window.scrollTo({top:0}); return;
  }
  if('logout' in d){await sb.auth.signOut();sesion=null;vista='tienda';await cargarPublico();render();return;}
  if('salir' in d){vista='tienda';await cargarPublico();render();window.scrollTo({top:0});return;}
  if('tab' in d){tab=d.tab;render();return;}

  /* --- pedidos --- */
  if('entregar' in d){
    const p=pedidos.find(x=>x.id===d.entregar);
    if(!confirm('¿Confirmas que '+p.cliente+' ya pagó '+CLP(p.total)+'?\n\nSe va a descontar del stock una cuenta.')) return;
    const {error}=await sb.rpc('entregar_pedido',{p_pedido_id:d.entregar});
    if(error){toast(error.message.includes('SIN_STOCK')?'No quedan cuentas de ese plan':'No se pudo entregar');return;}
    await cargarAdmin(); render(); toast('Entregado. Ya puedes mandar el código.'); return;
  }
  if('borrarPed' in d){
    const p=pedidos.find(x=>x.id===d.borrarPed);
    if(p.estado==='entregado' && !confirm('Este pedido ya fue entregado. Si lo borras pierdes el registro de la venta, pero la cuenta sigue marcada como vendida. ¿Continuar?')) return;
    const {error}=await sb.from('pedidos').delete().eq('id',d.borrarPed);
    if(error){toast('No se pudo eliminar');return;}
    await cargarAdmin(); render(); toast('Pedido eliminado'); return;
  }
  if('deshacer' in d){
    if(!confirm('La cuenta vuelve al stock y el pedido queda pendiente.\n\nSi el cliente ya canjeó su código, esa cuenta quedó vista: conviene cambiarle la clave antes de revenderla. ¿Continuar?')) return;
    await sb.from('cuentas').update({estado:'disponible',pedido_id:null,entregada:null}).eq('pedido_id',d.deshacer);
    await sb.from('pedidos').update({estado:'pendiente'}).eq('id',d.deshacer);
    await cargarAdmin(); render(); toast('Entrega deshecha, cuenta devuelta al stock'); return;
  }
  if('cancelar' in d){
    await sb.from('pedidos').update({estado:'cancelado'}).eq('id',d.cancelar);
    await cargarAdmin(); render(); toast('Pedido cancelado'); return;
  }

  /* --- productos --- */
  if('newProd' in d){mProducto(null);return;}
  if('editProd' in d){mProducto(d.editProd);return;}
  if('togProd' in d){
    const p=productos.find(x=>x.id===d.togProd);
    await sb.from('productos').update({activo:!p.activo}).eq('id',p.id);
    await cargarAdmin(); render(); return;
  }
  if('delProd' in d){
    const {error}=await sb.from('productos').delete().eq('id',d.delProd);
    if(error){toast('Tiene cuentas asociadas: ocúltalo mejor');return;}
    await cargarAdmin(); render(); return;
  }
  if('saveProd' in d){
    const f=$('p-file').files[0];
    let url=$('p-img').value.trim();
    if(f){
      t.disabled=true; t.textContent='Subiendo imagen…';
      try{ url=await subirImagen(f); }
      catch(err){ t.disabled=false; t.textContent='Guardar';
        $('p-err').innerHTML='<p class="err">No se pudo subir la imagen. Revisa que hayas corrido el SQL del almacenamiento.</p>'; return; }
      t.disabled=false; t.textContent='Guardar';
    }
    const datos={servicio:$('p-serv').value.trim(),nombre:$('p-nom').value.trim(),
      precio:parseInt($('p-prec').value,10),descripcion:$('p-desc').value.trim(),
      color:$('p-col').value,imagen:url};
    if(!datos.servicio||!datos.nombre||!(datos.precio>0)){$('p-err').innerHTML='<p class="err">Servicio, nombre y precio son obligatorios.</p>';return;}
    const {error}=d.saveProd? await sb.from('productos').update(datos).eq('id',d.saveProd)
                            : await sb.from('productos').insert(datos);
    if(error){$('p-err').innerHTML='<p class="err">'+esc(error.message)+'</p>';return;}
    cerrar(); await cargarAdmin(); render(); toast('Plan guardado'); return;
  }

  /* --- cuentas --- */
  if('newCta' in d){ if(!productos.length){toast('Primero crea un plan');return;} mCuentas(); return; }
  if('saveCta' in d){
    const pid=$('s-prod').value;
    const ls=$('s-lin').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!ls.length){$('s-err').innerHTML='<p class="err">Escribe al menos una cuenta.</p>';return;}
    const {error}=await sb.from('cuentas').insert(ls.map(l=>({producto_id:pid,credencial:l})));
    if(error){$('s-err').innerHTML='<p class="err">'+esc(error.message)+'</p>';return;}
    cerrar(); await cargarAdmin(); render(); toast(ls.length+' cuentas cargadas'); return;
  }
  if('delCta' in d){await sb.from('cuentas').delete().eq('id',d.delCta);await cargarAdmin();render();return;}

  /* --- ajustes --- */
  if('met' in d){
    cfg[d.met]=!cfg[d.met];
    await sb.from('config').update({[d.met]:cfg[d.met]}).eq('id',1);
    t.setAttribute('aria-pressed',cfg[d.met]); return;
  }
  if('saveCfg' in d){
    const datos={nombre:$('c-nombre').value.trim(),titular:$('c-titular').value.trim(),
      bajada:$('c-bajada').value.trim(),whatsapp:$('c-wa').value.trim(),email:$('c-email').value.trim(),
      link_pago:$('c-link').value.trim(),pago:$('c-pago').value.trim(),caja_datos:$('c-caja').value.trim(),
      faq_demora:$('c-fd').value.trim(),faq_falla:$('c-ff').value.trim()};
    const {error}=await sb.from('config').update(datos).eq('id',1);
    if(error){toast('No se pudo guardar');return;}
    Object.assign(cfg,datos); render(); toast('Ajustes guardados'); return;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modalBloqueado)cerrar();});

/* ====== ARRANQUE ====== */
(async function(){
  const ok=await cargarPublico();
  if(!ok) return;
  render();
  if(location.hash==='#panel') mLogin();
})();
</script>
